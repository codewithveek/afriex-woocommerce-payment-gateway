name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  phpcs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs

  php-syntax:
    name: PHP syntax (7.4 - 8.3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  build:
    name: Block checkout bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run lint:js
      - run: npm run build

      # The bundle is what makes the gateway visible on block checkout, so a
      # build that silently produced nothing must fail here rather than ship.
      - name: Assert the bundle exists
        run: test -s assets/js/build/afriex-blocks-checkout.js
